<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (PAS-UI-013; proappstore-online/platform#188).
      A per-app tightening of the platform header, which allows 'unsafe-inline'
      for scripts. Only script-src and the anti-injection directives are set
      here, so every other directive stays the platform's (a <meta> CSP can
      only tighten). Sources:
        'sha256-…'                            the pre-paint theme bootstrap
                                              below — recompute if it changes;
                                              qa/csp.mjs fails when they drift
        https://api.proappstore.online        platform analytics.js
        https://static.cloudflareinsights.com the Cloudflare Web Analytics
                                              beacon analytics.js injects
      No 'unsafe-inline' and no 'unsafe-eval': an injected inline script tag
      does not run. React escapes everything and the app has no HTML sinks
      (qa/csp.mjs checks), so this is the second line of defence.
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-rA6zK11dd/6hXmD2iAf0oU5Vz1xGmNxcqs0LJ1ZZPbU=' https://api.proappstore.online https://static.cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <meta name="description" content="One database of all your leads — contact details, social profiles, and lists for every purpose." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leads" />
    <meta property="og:description" content="One database of all your leads — contact details, social profiles, and lists for every purpose." />
    <meta property="og:url" content="https://leads.proappstore.online/" />
    <meta property="og:image" content="https://leads.proappstore.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leads" />
    <meta name="twitter:description" content="One database of all your leads — contact details, social profiles, and lists for every purpose." />
    <meta name="twitter:image" content="https://leads.proappstore.online/og-image.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function() {
        var pref = localStorage.getItem('stores-theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.dataset.theme = 'dark';
        var text = localStorage.getItem('stores-text-size');
        if (text === 'lg' || text === 'sm') document.documentElement.dataset.text = text;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Leads — ProAppStore</title>
    <script src="https://api.proappstore.online/v1/analytics.js?app=leads" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
