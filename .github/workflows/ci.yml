name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  router:
    uses: ProAgentStore/runner-router/.github/workflows/router.yml@v1
    with:
      included-minutes: 2000
      self-hosted-labels: 'self-hosted,pags'
    secrets:
      billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}

  typecheck:
    needs: router
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --with-deps runs apt, so it is Linux-only; the macOS pags runners just need the browser.
      - name: Install Chromium for browser QA
        if: runner.os == 'Linux'
        run: pnpm --filter @leads/web exec playwright-core install --with-deps chromium
      - name: Install Chromium for browser QA (macOS)
        if: runner.os != 'Linux'
        run: pnpm --filter @leads/web exec playwright-core install chromium
      - run: pnpm run prebuild
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      # The manifest tests: every registered action in mcp.json run against a
      # real SQLite built from migrations.json (node:sqlite, Node 22), including
      # one cross-user negative per scoped action (PAS-DATA-022). CI stopped at
      # typecheck before, so a scoping regression shipped on a green run
      # (proappstore-online/platform#185, PAS-OPS-001).
      # Mobile overflow/tap-target, sorting and activity use the real app against fixture data.
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
